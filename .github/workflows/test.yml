on:
  push:
    branches:
      - master
      - ci-test
  pull_request:
    branches:
      - master

# Note that a full "go test" is quite heavy,
# as it runs many builds under the hood.
# The default -timeout=10m can be hit by the hosted runners.
#
# Also note that we cache Go via Namespace's cache volumes,
# which requires the runner profiles to have caching and git mirrors enabled.

name: Test
jobs:
  test:
    strategy:
      # We mainly develop on Linux, so being able to see MacOS and Windows failures
      # is useful even if we already know at least one job will fail.
      fail-fast: false
      matrix:
        go-version: [1.27.x]
        # We have a sponsorship from Namespace which gives us a business plan,
        # with concurrency limits set at:
        #
        #  * Linux: 160 vCPU, 320 GB RAM
        #  * Windows: 80 vCPU, 160 GB RAM
        #  * macOS: 48 vCPU, 112 GB RAM
        #
        # We've sized the runner profiles below as follows,
        # which is plenty powerful while still allowing concurrent CI runs:
        #
        #  * Linux (amd64, Ubuntu 26.04): 16 vCPU, 32 GB RAM
        #  * Windows (amd64, Server 2022): 16 vCPU, 32 GB RAM
        #  * macOS (arm64, Tahoe 26): 12 vCPU, 28 GB RAM
        os: [namespace-profile-linux, namespace-profile-macos, namespace-profile-windows]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: namespacelabs/nscloud-checkout-action@v9
    - uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
        cache: false
    - uses: namespacelabs/nscloud-cache-action@v1
      with:
        cache: go
    - run: go test -timeout=15m ./...
    # macos and windows failures with bincmp can be hard to reproduce locally,
    # so upload the binaries as artifacts.
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: bincmp_output
        path: bincmp_output/

    # Static checks from this point forward. Only run on one Go version and on
    # linux, since it's the fastest platform, and the tools behave the same.
    - if: matrix.os == 'namespace-profile-linux' && matrix.go-version == '1.27.x'
      run: ./scripts/crlf-test.sh
    - if: matrix.os == 'namespace-profile-linux' && matrix.go-version == '1.27.x'
      run: diff <(echo -n) <(gofmt -d .)
    - if: matrix.os == 'namespace-profile-linux' && matrix.go-version == '1.27.x'
      run: go vet ./...
    - if: matrix.os == 'namespace-profile-linux' && matrix.go-version == '1.27.x'
      uses: dominikh/staticcheck-action@v1
      with:
        version: "2026.2.1"
        install-go: false

  # We don't care about GOARCH=386 particularly, hence -short,
  # but it helps ensure we support 32-bit hosts and targets well.
  # TODO: use CGO_ENABLED=1 once we figure out how to install gcc-multilib,
  # and once gotooltest forwards the value of CGO_ENABLED to the scripts.
  test-386:
    runs-on: namespace-profile-linux
    env:
      GOARCH: 386
    steps:
    - uses: namespacelabs/nscloud-checkout-action@v9
    - uses: actions/setup-go@v7
      with:
        go-version: 1.27.x
        cache: false
    - uses: namespacelabs/nscloud-cache-action@v1
      with:
        cache: go
    - run: go test -short ./...

  # Only run the short tests with -race, because otherwise the overhead is too much.
  # We only test on Linux, as races are unlikely to be OS-specific.
  # We use GOAMD64=v3 because that significantly speeds up the race detector.
  test-race:
    runs-on: namespace-profile-linux
    env:
      GOAMD64: v3
    steps:
    - uses: namespacelabs/nscloud-checkout-action@v9
    - uses: actions/setup-go@v7
      with:
        go-version: 1.27.x
        cache: false
    - uses: namespacelabs/nscloud-cache-action@v1
      with:
        cache: go
    - run: go test -short -race ./...

  test-third-party:
    runs-on: namespace-profile-linux
    steps:
    - uses: namespacelabs/nscloud-checkout-action@v9
    - uses: actions/setup-go@v7
      with:
        go-version: 1.27.x
        cache: false
    - uses: namespacelabs/nscloud-cache-action@v1
      with:
        cache: go
    - run: go install
    - run: ./scripts/check-third-party.sh
