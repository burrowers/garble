name: Bug Report
description: File a bug report.

body:
  - type: checkboxes
    id: tested-master
    attributes:
      label: "Reproduce on master"
      description: |
        Before filing a bug report, install the latest development version with
        `go install mvdan.cc/garble@master` and try reproducing the issue again.
        Make sure you run the newly installed binary, not an older copy on your PATH.
        If the issue is already fixed on master, please do not file a bug report.
      options:
        - label: "I have tested the latest master and the issue still occurs."
          required: true

  - type: textarea
    id: garble-version
    attributes:
      label: "Output of `garble version`:"
      description: "Paste the output from the master build used to reproduce the issue."
      placeholder: |
        mvdan.cc/garble v0.14.2

        Build settings:
              -buildmode exe
               -compiler gc
             CGO_ENABLED 1
                  GOARCH amd64
                    GOOS linux
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: "Output of `go version`:"
      placeholder: "go version go1.27 linux/amd64"
    validations:
      required: true

  - type: textarea
    id: go-env
    attributes:
      label: "Output of `go env -changed` in your module/workspace:"
      placeholder: |
        GO111MODULE=""
        GOARCH="arm64"
        GOBIN="/Users/gopher/go/bin"
        GOCACHE="/Users/gopher/go/cache"
        GOENV="/Users/gopher/Library/Application Support/go/env"
        GOEXE=""
        GOEXPERIMENT=""
        GOFLAGS=""
        [...]
      render: shell
    validations:
      required: true

  - type: textarea
    id: what-did-you-do
    attributes:
      label: "What did you do?"
      description: "Provide clear steps for others to reproduce the error. If your code is private, try reproducing via a small program. As a fallback, provide as many relevant details as possible."
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: "What did you see happen?"
      description: Command invocations and their associated output. Prefer copying text output over using screenshots.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: "What did you expect to see?"
      description: Why is the current output incorrect, and any additional context we may need to understand the issue.
    validations:
      required: true
